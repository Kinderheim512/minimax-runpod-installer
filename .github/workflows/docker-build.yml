name: Build and Push Docker Image

on:
  # Déclenchement manuel uniquement : le build/push de l'image Docker
  # (plusieurs Go, ~20 min) ne doit plus se lancer automatiquement à
  # chaque commit sur main. Il faut aller dans l'onglet Actions du repo
  # GitHub → "Build and Push Docker Image" → "Run workflow" pour le
  # déclencher explicitement.
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/minimax-h3-comfyui:latest
          cache-from: type=gha
          # mode=min (au lieu de max) : n'exporte vers le cache GHA que les
          # couches nécessaires à reconstruire l'image finale, pas TOUTES
          # les couches intermédiaires. Avec le découpage explicite du
          # Dockerfile en COPY ciblés (heavy/light), le cache par couche
          # fonctionne déjà bien sans mode=max — qui, lui, force à
          # ré-uploader plusieurs Go (PyTorch, toolkit CUDA...) vers le
          # cache à chaque build, même quand leur contenu n'a pas changé.
          cache-to: type=gha,mode=min
