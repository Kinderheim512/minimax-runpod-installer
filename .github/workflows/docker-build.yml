name: Build and Push Docker Image

on:
  # Déclenchement manuel uniquement : le build/push de l'image Docker
  # (plusieurs Go, ~20 min) ne doit plus se lancer automatiquement à
  # chaque commit sur main. Il faut aller dans l'onglet Actions du repo
  # GitHub → "Build and Push Docker Image" → "Run workflow" pour le
  # déclencher explicitement.
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Libère de l'espace disque sur le runner AVANT le build Docker : le
      # bake de la wheel SageAttention (bake_sageattention_wheel(),
      # lib/python.sh) installe en plus le toolkit CUDA complet via apt
      # pendant le build heavy, ce qui saturait l'espace disque du runner
      # ubuntu-latest (~14 Go libres) en plus de PyTorch/ComfyUI/dépendances
      # déjà téléchargés — c'est ce qui avait forcé la désactivation du bake
      # dans le Dockerfile (SAGEATTENTION_DOCKER_BAKE=false). Les
      # répertoires supprimés ci-dessous (.NET, Android SDK, GHC, Swift)
      # sont des composants préinstallés du runner GitHub-hosted, non
      # utilisés par ce workflow (checkout + Buildx + login + build/push
      # Docker uniquement — aucune étape .NET/Android/Haskell/Swift) :
      # vérifié avant d'ajouter cette étape. Solution shell native plutôt
      # qu'une action tierce, comme demandé.
      - name: Free disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /

          du -sh \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            2>/dev/null || true

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift || true

          docker image prune -af || true

          echo "=== Disk after cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/minimax-h3-comfyui:latest
          cache-from: type=gha
          # mode=min (au lieu de max) : n'exporte vers le cache GHA que les
          # couches nécessaires à reconstruire l'image finale, pas TOUTES
          # les couches intermédiaires. Avec le découpage explicite du
          # Dockerfile en COPY ciblés (heavy/light), le cache par couche
          # fonctionne déjà bien sans mode=max — qui, lui, force à
          # ré-uploader plusieurs Go (PyTorch, toolkit CUDA...) vers le
          # cache à chaque build, même quand leur contenu n'a pas changé.
          cache-to: type=gha,mode=min
