name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    # Un commit qui ne touche à RIEN de pertinent pour l'image (doc, le
    # workflow CI lui-même...) ne déclenche même pas ce workflow — pas
    # seulement "cache réutilisé", carrément aucun job lancé, aucune minute
    # CI consommée. Complémentaire du découpage Dockerfile/docker-build-
    # steps-{heavy,light}.sh : celui-ci protège le CACHE des étapes
    # coûteuses (apt/CUDA/PyTorch/SageAttention) pour les commits qui
    # déclenchent quand même le workflow (ex: lib/manager.sh, un preset) ;
    # ceci évite même le déclenchement pour ceux qui ne concernent QUE la
    # doc. Toute liste ici doit rester strictement des fichiers qui ne
    # finissent jamais dans l'image ET n'influencent aucune étape du build —
    # en cas de doute, NE PAS ajouter le fichier ici (mieux vaut un build
    # inutile qu'une image obsolète non reconstruite).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/minimax-h3-comfyui:latest
          cache-from: type=gha
          # mode=min (au lieu de max) : n'exporte vers le cache GHA que les
          # couches nécessaires à reconstruire l'image finale, pas TOUTES
          # les couches intermédiaires. Avec le découpage explicite du
          # Dockerfile en COPY ciblés (heavy/light), le cache par couche
          # fonctionne déjà bien sans mode=max — qui, lui, force à
          # ré-uploader plusieurs Go (PyTorch, toolkit CUDA...) vers le
          # cache à chaque build, même quand leur contenu n'a pas changé.
          cache-to: type=gha,mode=min
