name: Release

# Builds the launcher for Windows, macOS (arm64 + x64) and Linux on every
# `v*` tag, and publishes the artefacts on a GitHub release. The binaries are
# UNSIGNED: see the README ("Unsigned binaries") for the Gatekeeper /
# SmartScreen workaround.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    name: Icons (png / ico / icns)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow
      - name: Regenerate the icon set
        run: |
          test -f launcher/icon.png
          test -f launcher/icon.ico
          test -f launcher/icon.icns
          python - <<'PY'
          from PIL import Image
          ico = Image.open("launcher/icon.ico")
          sizes = sorted(ico.info.get("sizes", []))
          print("ico sizes:", sizes)
          assert len(sizes) >= 7, sizes
          icns = Image.open("launcher/icon.icns")
          print("icns sizes:", sorted(icns.info.get("sizes", [])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: launcher/icon.*

  build:
    name: Build (${{ matrix.label }})
    needs: icons
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: MiniMaxH3Launcher-windows-x64.exe
          # One macOS job, not two. macos-13 (the Intel image) is being retired
          # and sits queued for tens of minutes, which stalls the release; and a
          # real universal2 build is not reachable either, because Pillow ships
          # per-architecture macOS wheels and PyInstaller refuses to fatten them
          # ("...PIL/_webp.cpython-311-darwin.so is not a fat binary!"). So the
          # macOS artefact is Apple silicon, and the README says how an Intel
          # user builds their own. The name follows `lipo -archs`, never a guess.
          - os: macos-14
            label: macos
            artifact: MiniMaxH3Launcher-macos-arm64
          - os: ubuntu-22.04
            label: linux-x64
            artifact: MiniMaxH3Launcher-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: launcher
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
      - name: Install the GUI dependencies (optional extras)
        run: python -m pip install ".[tray,themes]" || echo "optional extras unavailable"
      - name: Build
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            # universal2 needs a universal2 interpreter; when it is not
            # available the native build is still a valid artefact.
            python scripts/build_exe.py --target-arch universal2               || python scripts/build_exe.py
          else
            python scripts/build_exe.py
          fi
      - name: Smoke-test the binary
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          exe = next(p for p in pathlib.Path("dist").iterdir() if p.is_file())
          print("built:", exe)
          assert exe.stat().st_size > 1_000_000, exe.stat().st_size
          PY
      - name: Rename the artefact
        shell: bash
        run: |
          set -e
          mkdir -p out
          # A --onefile build produces exactly one file; more than one means
          # the build leaked something and the artefact would be ambiguous.
          count=$(find dist -maxdepth 1 -type f | wc -l)
          [ "$count" -eq 1 ] || { echo "expected 1 artefact, found $count"; ls -la dist; exit 1; }
          artefact=$(find dist -maxdepth 1 -type f)
          name="${{ matrix.artifact }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            archs=$(lipo -archs "$artefact")
            echo "built architectures: $archs"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) name="MiniMaxH3Launcher-macos-universal2" ;;
              *x86_64*) name="MiniMaxH3Launcher-macos-x64" ;;
              *)        name="MiniMaxH3Launcher-macos-arm64" ;;
            esac
          fi
          cp "$artefact" "out/$name"
          chmod +x "out/$name"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Every artefact, filtered by name below: the upload step names them
          # after the matrix label (`windows-x64`, …), not after the file, so a
          # `pattern:` here would match nothing.
          path: artifacts
      - name: Flatten the artefacts
        run: |
          mkdir -p release
          # The icon set is an input of the build, not something a user
          # downloads: only the launcher binaries are published.
          find artifacts -type f -name 'MiniMaxH3Launcher*' -exec cp {} release/ \;
          count=$(ls release | wc -l)
          echo "publishing $count file(s):"
          ls -la release
          [ "$count" -ge 3 ] || { echo "expected at least 3 artefacts"; exit 1; }
      - name: Describe the artefacts
        id: describe
        run: |
          {
            echo 'TABLE<<EOF'
            echo '| File | Platform |'
            echo '| --- | --- |'
            for f in $(ls release); do
              case "$f" in
                *windows*) plat='Windows 10/11 (x64)' ;;
                *macos-universal2*) plat='macOS (Apple silicon + Intel)' ;;
                *macos-arm64*) plat='macOS (Apple silicon)' ;;
                *macos-x64*) plat='macOS (Intel)' ;;
                *linux*) plat='Linux (x64)' ;;
                *) plat='—' ;;
              esac
              echo "| \`$f\` | $plat |"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Desktop launcher

            Rents the RunPod pod, opens the SSH tunnel and puts ComfyUI (or the
            LoRA-training desktop) in your browser. Windows, macOS and Linux.

            **Deploy the template on RunPod:**
            https://console.runpod.io/hub/template/oa2vozqbum?ref=76jvawoy

            ${{ steps.describe.outputs.TABLE }}

            An Intel Mac is not covered by a prebuilt binary (Pillow ships
            per-architecture macOS wheels, so a universal build is not
            possible): build it locally with `python scripts/build_exe.py`.

            ### Unsigned binaries

            On macOS, Gatekeeper quarantines anything downloaded through a
            browser — clear the flag once:

                xattr -dr com.apple.quarantine MiniMaxH3Launcher-macos-*

            On Windows, SmartScreen may warn about an unsigned publisher:
            "More info" then "Run anyway".

            ### First run

            1. Launch the app — it opens the credentials dialog.
            2. Paste your RunPod API key and press Save.
            3. Pick **ComfyUI video** in the footer and press **Start**.
