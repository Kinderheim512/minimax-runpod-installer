[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-h3-launcher"
version = "2.0.0"
description = "Desktop launcher for the MiniMax H3 RunPod installer (ComfyUI + LoRA training)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kinderheim512" }]
keywords = ["runpod", "comfyui", "minimax-h3", "lora", "launcher"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Capture",
]

# The launcher is stdlib-only at runtime: tkinter ships with CPython and the
# SSH client ships with the OS. Everything below is optional.
dependencies = []

[project.optional-dependencies]
# Nicer ttk themes; without it the GUI falls back to its hand-rolled palette.
themes = ["ttkbootstrap>=1.10"]
# Notification-area icon.
tray = ["pystray>=0.19", "pillow>=10"]
# Frozen build.
gui-build = ["pyinstaller>=6", "pillow>=10"]
# Test suite.
test = ["pytest>=8"]

[project.scripts]
minimax-launcher = "launcher.main:cli"

[project.gui-scripts]
minimax-launcher-gui = "launcher.gui:main"

[tool.setuptools]
packages = ["launcher", "launcher.locales"]
include-package-data = true

[tool.setuptools.package-data]
launcher = ["icon.png", "icon.ico", "icon.icns", "assets/**/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:launcher.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
